.hd{background:linear-gradient(135deg,#6366f1,#8b5cf6,#d946ef);color:#fff;padding:22px 18px 18px;border-radius:0 0 22px 22px;}

.task .ck{width:22px;height:22px;border:2px solid #c7d2fe;border-radius:6px;margin-right:11px;flex:none;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;}
.task .ck.on{background:#6366f1;border-color:#6366f1;}
.task .t{font-weight:600;font-size:15px;color:#111827;line-height:1.4;}
.task .t.done{color:#9ca3af;text-decoration:line-through;}
.task .d{color:#6b7280;font-size:13px;margin-top:5px;line-height:1.55;}

.task .lk a{color:#4f46e5;text-decoration:none;margin:0 8px 4px 0;background:#eef2ff;padding:4px 11px;border-radius:20px;display:inline-block;font-size:12px;}
.sig{background:#fff;margin:0 12px;border-radius:14px;padding:6px 14px;box-shadow:0 1px 3px rgba(17,24,39,.06);border:1px solid #f1f2f6;}
.sig .s{font-size:13px;color:#374151;padding:8px 0;border-bottom:1px dashed #f0f0f0;display:flex;align-items:center;}
.sig .s:last-child{border-bottom:none;}
.sig .s.cur{background:#eef2ff;border-radius:8px;padding:8px 8px;font-weight:700;color:#4f46e5;}
.sig .star{color:#f59e0b;margin-left:6px;font-size:12px;}
.sig .tag{margin-left:auto;font-size:11px;color:#4f46e5;font-weight:700;}
.qt{background:rgba(255,255,255,.75);margin:12px;padding:12px 14px;border-radius:14px;font-size:13px;color:#6366f1;border-left:3px solid #a78bfa;font-style:italic;}
.ft{color:#9ca3af;font-size:11px;text-align:center;margin-top:18px;line-height:1.7;}
.ms{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;margin:10px 12px 0;padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;}

const PROGRESS = {"signal": {"chapter": 1, "updated": "2026-08-26"}};

const now = new Date();
const dayNames = PLAN.dayNames;
const dow = now.getDay();
const todayStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');

const target = new Date(PLAN.countdown.targetDate + 'T00:00:00');
const cdDays = Math.ceil((target - now) / 86400000);

let sigChapter = 1;
if (PROGRESS.signal && PROGRESS.signal.chapter) sigChapter = parseInt(PROGRESS.signal.chapter);
let sigName = '';
if (PLAN.signalChapters && sigChapter >= 1 && sigChapter <= PLAN.signalChapters.length) {
  sigName = PLAN.signalChapters[sigChapter-1].c;
}
function fmt(s){ return s ? String(s).split('{CH}').join(sigName) : s; }

document.getElementById('goal').textContent = PLAN.goal;
document.getElementById('date').textContent = todayStr + '  ' + dayNames[dow];
if (cdDays > 0) document.getElementById('cd').innerHTML = '距初试还有 <b>' + cdDays + '</b> 天';
else if (cdDays === 0) document.getElementById('cd').textContent = '今天就是初试！';
else document.getElementById('cd').textContent = '初试已过 ' + (-cdDays) + ' 天';

let msgs = [];
if (PLAN.milestones) {
  PLAN.milestones.forEach(function(m){
    const md = new Date(m.date + 'T00:00:00');
    const diff = Math.ceil((md - now) / 86400000);
    if (diff === 0) msgs.push('🚨 里程碑：' + m.label + '（就是今天！）');
    else if (diff > 0 && diff <= 7) msgs.push('⏳ ' + diff + ' 天后里程碑：' + m.label);
  });
}
document.getElementById('msgs').innerHTML = msgs.map(function(x){return '<div class="ms">'+x+'</div>';}).join('');

if (PLAN.weekTheme) { document.getElementById('wt').style.display='block'; document.getElementById('wt').textContent = PLAN.weekTheme; }

function renderTask(t){
  const id = 't_' + Math.random().toString(36).slice(2);
  const done = localStorage.getItem(id) === '1';
  const lk = (t.l && t.l.length) ? '<div class="lk">' + t.l.map(function(x){return '<a href="'+x.u+'">'+x.n+'</a>';}).join('') + '</div>' : '';
  return '<div class="task"><div class="row"><div class="ck'+(done?' on':'')+'" id="'+id+'">'+(done?'✓':'')+'</div><div style="flex:1"><div class="t'+(done?' done':'')+'">'+fmt(t.t)+'</div>'+(t.d?'<div class="d">'+fmt(t.d)+'</div>':'')+lk+'</div></div></div>';
}

let dailyHtml = '';
PLAN.daily.forEach(function(t){ dailyHtml += renderTask(t); });

  const cur = (i+1 === sigChapter) ? ' cur' : '';

document.getElementById('ft').innerHTML = PLAN.footer;

document.querySelectorAll('.ck').forEach(function(el){

  });
});
